# Token Range Monitor sync backend (Cloudflare Worker + D1).
# See README.md for setup. Secrets are NOT stored here: use `wrangler secret put`
# (prod) or `.dev.vars` (local dev).
name = "token-range-monitor"
main = "src/index.ts"
tsconfig = "./tsconfig.json"
compatibility_date = "2026-10-01"

[vars]
# Public origin of this worker, no trailing slash. OAuth redirect URIs and the
# link URL shown to users are built from it. Local dev overrides it in .dev.vars.
PUBLIC_URL = "https://token-range-monitor.micke-dahlgren.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "token-range-monitor"
database_id = "c432401c-b857-4055-b6df-0f5bdf045dc9"
migrations_dir = "migrations"

# Rate limit for /v1/lists: 60 requests per 60 s per device (Workers Rate
# Limiting binding: counted at the edge, per location, no D1 writes).
# namespace_id is any integer you pick, unique within the Cloudflare account.
[[ratelimits]]
name = "LISTS_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Daily housekeeping (UTC): deletes expired link codes, lists not updated for
# 22 days and devices unused for 90 days.
[triggers]
crons = ["17 3 * * *"]
